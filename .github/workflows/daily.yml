name: V3 Daily Signal

on:
  workflow_dispatch:

jobs:
  run-daily-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: uv sync

      - name: Run signal engine
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          # 策略參數使用 Repository Variables；未設定時沿用預設值。
          EPS_THRESHOLD: ${{ vars.EPS_THRESHOLD || '5.0' }}
          ROE_THRESHOLD: ${{ vars.ROE_THRESHOLD || '15.0' }}
          BACKTEST_YEARS: ${{ vars.BACKTEST_YEARS || '3' }}
          HOLD_DAYS: ${{ vars.HOLD_DAYS || '20' }}
          TARGET_RETURN: ${{ vars.TARGET_RETURN || '0.10' }}
          STOP_LOSS: ${{ vars.STOP_LOSS || '0.08' }}
          WEIGHT_FUNDAMENTAL: ${{ vars.WEIGHT_FUNDAMENTAL || '0.3' }}
          WEIGHT_TECHNICAL: ${{ vars.WEIGHT_TECHNICAL || '0.3' }}
          WEIGHT_BACKTEST: ${{ vars.WEIGHT_BACKTEST || '0.4' }}
          MIN_TECH_SCORE_FOR_SIGNAL: ${{ vars.MIN_TECH_SCORE_FOR_SIGNAL || '60' }}
          MIN_TOTAL_SCORE_FOR_BUY: ${{ vars.MIN_TOTAL_SCORE_FOR_BUY || '65' }}
          NIGHT_GAP_BIG: ${{ vars.NIGHT_GAP_BIG || '1.5' }}
          NIGHT_GAP_SMALL: ${{ vars.NIGHT_GAP_SMALL || '0.5' }}
        run: uv run python main.py
